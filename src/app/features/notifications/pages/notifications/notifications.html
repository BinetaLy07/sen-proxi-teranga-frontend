<div class="flex flex-wrap items-end justify-between gap-4">
  <div>
    <p class="eyebrow">NOTIFICATIONS</p>
    <h1 class="page-title">Ce qui s'est passé</h1>
  </div>
  @if (aDesNonLues()) {
    <button type="button" class="secondary-button" (click)="toutLu()">Tout marquer comme lu</button>
  }
</div>

@if (error()) {
  <div class="notice error" role="alert">{{ error() }}</div>
}
@if (loading()) {
  <p class="py-10" role="status">Chargement…</p>
}
@if (!loading() && notifications().length === 0) {
  <div class="mt-8 rounded-2xl border border-dashed border-gray-300 bg-white p-8 text-center">
    <p class="font-medium text-gray-900">Aucune notification pour le moment.</p>
  </div>
}

<ul class="mt-8 flex flex-col gap-3">
  @for (n of notifications(); track n.id) {
    <li>
      <button
        type="button"
        (click)="ouvrir(n)"
        class="flex w-full items-start gap-4 rounded-xl border p-4 text-left"
        [class]="n.lue ? 'border-gray-200 bg-white' : 'border-indigo-200 bg-indigo-50'"
      >
        <span
          class="mt-1.5 size-2.5 shrink-0 rounded-full"
          [class]="n.lue ? 'bg-transparent' : 'bg-brand-500'"
          aria-hidden="true"
        ></span>
        <span class="min-w-0 flex-1">
          <span class="flex flex-wrap items-center gap-2">
            <span class="rounded-full bg-white px-2 py-0.5 text-xs font-semibold text-gray-600">{{
              libelles[n.type]
            }}</span>
            <strong class="text-gray-900">{{ n.titre }}</strong>
            @if (!n.lue) {
              <span class="sr-only">(non lue)</span>
            }
          </span>
          <span class="mt-1 block text-sm text-gray-700">{{ n.message }}</span>
          <span class="mt-1 block text-xs text-gray-500">{{
            n.date | date: "dd/MM/yyyy 'à' HH:mm"
          }}</span>
        </span>
      </button>
    </li>
  }
</ul>
