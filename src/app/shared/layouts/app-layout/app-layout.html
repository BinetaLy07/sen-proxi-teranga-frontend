<div class="min-h-screen bg-gray-50">
  <header class="border-b border-gray-200 bg-white">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-4 px-6 pt-5">
      <a routerLink="/espace" class="brand" aria-label="Sen Proxi Teranga, mon espace"
        ><span class="brand-mark">S<span>•</span></span>sen proxi teranga</a
      >
      <div class="flex items-center gap-3">
        <span
          class="hidden rounded-full border border-gray-200 px-3 py-1 text-xs text-gray-500 sm:inline-flex"
          >{{ libelleRole() }}</span
        >
        <button class="secondary-button" (click)="deconnecter()">Se déconnecter</button>
      </div>
    </div>

    <!-- Le menu : défile horizontalement sur téléphone -->
    <nav class="mx-auto flex max-w-5xl gap-1 overflow-x-auto px-6 pt-3" aria-label="Menu principal">
      @for (lien of liens(); track lien.chemin) {
        <a
          [routerLink]="lien.chemin"
          routerLinkActive="!border-brand-500 !text-brand-500"
          [routerLinkActiveOptions]="{ exact: true }"
          class="whitespace-nowrap border-b-2 border-transparent px-3 py-3 text-sm font-medium text-gray-600 hover:text-gray-900"
          >{{ lien.libelle }}</a
        >
      }
    </nav>
  </header>

  <main class="mx-auto max-w-5xl px-6 py-10">
    <router-outlet />
  </main>
</div>
