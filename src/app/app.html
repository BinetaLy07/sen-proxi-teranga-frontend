@if (pwa.offline()) {
  <div class="bg-amber-50 px-5 py-3 text-center text-sm text-amber-900" role="status">
    Vous êtes hors ligne. La connexion et les services nécessitent une connexion internet.
  </div>
}
@if (pwa.updateReady()) {
  <div class="flex items-center justify-center gap-3 bg-indigo-50 px-5 py-3 text-sm" role="status">
    Une nouvelle version est disponible.
    <button class="text-link" (click)="pwa.reload()">Mettre à jour</button>
  </div>
}
@if (pwa.installable()) {
  <div class="flex items-center justify-center gap-3 border-b border-gray-200 px-5 py-2 text-sm">
    Emportez votre quartier avec vous.
    <button class="text-link" (click)="pwa.install()">Installer l’application</button>
  </div>
}
<router-outlet />
